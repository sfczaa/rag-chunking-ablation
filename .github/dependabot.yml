# Routine version PRs are disabled. Dependency upgrades are reviewed manually;
# this setting does not lock the installed package versions.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # Update together with deploy/space/README.md's sdk_version.
      - dependency-name: "gradio"
      # Check numerical compatibility with archived results before upgrading.
      - dependency-name: "numpy"

  - package-ecosystem: "pip"
    directory: "/deploy/space"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # Check compatibility with the archived FAISS indices and embeddings.
      - dependency-name: "faiss-cpu"
      - dependency-name: "sentence-transformers"
      - dependency-name: "numpy"
